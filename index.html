    <style>
        /* Reset and ensure scrollable layout */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #181818;
            -webkit-font-smoothing: antialiased;
            font-size: 16px;
            line-height: 1.5;
            overflow-x: hidden; /* prevent horizontal scroll */
            overflow-y: auto;  /* enable vertical scroll */
            height: 100%;
        }

        /* Simplify container and content structure */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Ensure all sections can scroll */
        .bodywrap, .bodywrap2 {
            min-height: 100vh;  /* make sure body content fills the screen */
            overflow: auto;     /* allow scroll on content overflow */
        }

        /* Navigation styles */
        .navbar, .nav-menu, .navbar2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        /* Contact form card */
        .glass-card {
            width: min(720px, 92%);
            margin: 0 auto;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 24px 24px 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.20);
            transform: none !important;
            perspective: initial !important;
        }

        .contact-input {
            width: 100%;
            max-width: 100%;
            display: block;
            box-sizing: border-box;
            color: inherit;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 14px;
            padding: 12px 14px;
            outline: none;
            transition: border-color .2s, background .2s, box-shadow .2s;
        }

        .contact-button {
            width: 100%;
            padding: 14px 16px;
            margin-top: 14px;
            border-radius: 14px;
        }

        /* Status line for form submission */
        #home-contact-status {
            margin-top: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 600;
            color: #f90043;
            opacity: 0.95;
        }

        /* Section spacing and mobile adjustments */
        .contact-ty-section {
            padding: 64px 0;
        }

        @media (max-width: 767px) {
            .contact-ty-section {
                padding: 48px 0 96px; /* Bottom gap on phones */
            }

            .glass-card {
                padding: 20px 16px 24px;
            }
        }
